<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SPARTANS Söz Təxmini</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="../../assets/css/frame.css">
  <link rel="stylesheet" href="adapt.css">
  <script src="words.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <p class="game-title" data-title>Söz Təxmini</p>
  <div class="alert-container" data-alert-container></div>
  <div class="guess-grid" data-guess-grid></div>
  <div class="keyboard" data-keyboard>
    <div class="kb-row">
      <button class="key" data-key="q">q</button><button class="key" data-key="e">e</button><button class="key" data-key="r">r</button><button class="key" data-key="t">t</button><button class="key" data-key="y">y</button><button class="key" data-key="u">u</button><button class="key" data-key="ı">ı</button><button class="key" data-key="o">o</button><button class="key" data-key="p">p</button>
    </div>
    <div class="kb-row">
      <button class="key" data-key="a">a</button><button class="key" data-key="s">s</button><button class="key" data-key="d">d</button><button class="key" data-key="f">f</button><button class="key" data-key="g">g</button><button class="key" data-key="h">h</button><button class="key" data-key="j">j</button><button class="key" data-key="k">k</button><button class="key" data-key="l">l</button><button class="key" data-key="ə">ə</button>
    </div>
    <div class="kb-row">
      <button class="key large" data-enter>YOXLA</button><button class="key" data-key="z">z</button><button class="key" data-key="x">x</button><button class="key" data-key="c">c</button><button class="key" data-key="v">v</button><button class="key" data-key="b">b</button><button class="key" data-key="n">n</button><button class="key" data-key="m">m</button><button class="key" data-key="ş">ş</button><button class="key" data-key="ğ">ğ</button><button class="key" data-key="ü">ü</button><button class="key" data-key="ö">ö</button><button class="key" data-key="ç">ç</button><button class="key" data-key="i">i</button><button class="key large" data-delete>SİL</button>
    </div>
  </div>
</body>
</html>
