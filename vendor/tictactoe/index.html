<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dos-crossa — SPARTANS</title>

    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../../assets/css/frame.css">
    <link rel="stylesheet" href="adapt.css">

    <script src="script.js" defer></script>
</head>
<body>

    <main class="main-container" id="main-container">

        <section class="start-menu" id="start-menu">
            <div class="icon-logo"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5.5 5.5 18.5 18.5M18.5 5.5 5.5 18.5"/></svg></i><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><circle cx="12" cy="12" r="6.6"/></svg></i></div>
            <div class="picker-card">
                <h4>Öz işarəni seç</h4>
                <div class="picker-toggle">
                    <button id="pick-x" class="active" aria-pressed="true" aria-label="X işarəsi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5.5 5.5 18.5 18.5M18.5 5.5 5.5 18.5"/></svg></button>
                    <button id="pick-o" aria-pressed="false" aria-label="O işarəsi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><circle cx="12" cy="12" r="6.6"/></svg></button>
                </div>
                <p>X BİRİNCİ OYNAYIR</p>
            </div>
            <div class="difficulty-card">
                <h4>Çətinliyi seç</h4>
                <div class="difficulty-buttons">
                    <button class="btn" data-difficulty="easy">Asan</button>
                    <button class="btn active" data-difficulty="medium">Orta</button>
                    <button class="btn" data-difficulty="hard">Çətin</button>
                </div>
            </div>
            <button class="btn btn-yellow" id="new-game-btn">Yeni tur (kompüterə qarşı)</button>
        </section>

        <section class="game-screen hidden" id="game-screen">
            <header class="game-header">
                <div class="icon-logo"><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5.5 5.5 18.5 18.5M18.5 5.5 5.5 18.5"/></svg></i><i><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><circle cx="12" cy="12" r="6.6"/></svg></i></div>
                <div class="turn-indicator" aria-live="polite">
                    <i id="turn-icon"></i><span>NÖVBƏ</span>
                </div>
                <button class="btn-restart" id="restart-btn" aria-label="Oyunu sıfırla"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.6h-4.6"/></svg></button>
            </header>

            <div class="thinking-indicator" id="thinking-indicator">Kompüter düşünür…</div>

            <div class="game-board" role="grid">
                <div class="board-cell" role="gridcell" tabindex="0" data-index="0"><i></i></div>
                <div class="board-cell" role="gridcell" tabindex="0" data-index="1"><i></i></div>
                <div class="board-cell" role="gridcell" tabindex="0" data-index="2"><i></i></div>
                <div class="board-cell" role="gridcell" tabindex="0" data-index="3"><i></i></div>
                <div class="board-cell" role="gridcell" tabindex="0" data-index="4"><i></i></div>
                <div class="board-cell" role="gridcell" tabindex="0" data-index="5"><i></i></div>
                <div class="board-cell" role="gridcell" tabindex="0" data-index="6"><i></i></div>
                <div class="board-cell" role="gridcell" tabindex="0" data-index="7"><i></i></div>
                <div class="board-cell" role="gridcell" tabindex="0" data-index="8"><i></i></div>
            </div>

            <footer class="game-footer">
                <div class="score-card" id="player-score-card">
                    <p id="player-score-label">X (SƏN)</p><div class="score" id="player-score">0</div>
                </div>
                <div class="score-card" id="tie-score-card">
                    <p>HEÇ-HEÇƏ</p><div class="score" id="tie-score">0</div>
                </div>
                <div class="score-card" id="cpu-score-card">
                    <p id="cpu-score-label">O (KOMPÜTER)</p><div class="score" id="cpu-score">0</div>
                </div>
            </footer>
        </section>
    </main>

    <div class="modal-overlay" id="result-modal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <p id="modal-result-text"></p>
            <div id="modal-winner-announcement" class="modal-winner-announcement"></div>
            <div class="modal-buttons">
                <button class="btn btn-silver" id="quit-btn">Çıx</button>
                <button class="btn btn-yellow" id="next-round-btn">Növbəti tur</button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="restart-modal" role="dialog" aria-modal="true">
        <div class="modal-content">
            <h2>OYUNU SIFIRLAMAQ?</h2>
            <div class="modal-buttons">
                <button class="btn btn-silver" id="cancel-restart-btn">Xeyr</button>
                <button class="btn btn-yellow" id="confirm-restart-btn">Bəli</button>
            </div>
        </div>
    </div>

</body>
</html>
