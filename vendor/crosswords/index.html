<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SPARTANS Krossvord</title>
<link rel="stylesheet" href="dist/crosswords.css">
<link rel="stylesheet" href="../../assets/css/frame.css">
<link rel="stylesheet" href="adapt.css">
<script src="puzzle.js"></script>
</head>
<body>
  <div class="cw-toolbar">
    <span class="cw-group"><i>Yoxla</i>
      <button id="test-clue" type="button">Sual</button>
      <button id="test-crossword" type="button">Şəbəkə</button>
    </span>
    <span class="cw-group"><i>Sil</i>
      <button id="clean-clue" type="button">Səhvlər</button>
      <button id="clean-crossword" type="button">Bütün səhvlər</button>
      <button id="reset-clue" type="button">Cari sual</button>
    </span>
    <span class="cw-group"><i>Kömək</i>
      <button id="reveal-cell" type="button">Hərf</button>
      <button id="reveal-clue" type="button">Söz</button>
    </span>
    <p class="cw-status" id="status">Şəbəkə yüklənir…</p>
  </div>

  <div class="cw-layout">
    <div class="cw-grid-wrap"><div id="crossword-grid-placeholder"></div></div>
    <div class="cw-clues-wrap"><div id="crossword-clues-placeholder"></div></div>
  </div>

  <script type="module">
    import { newCrosswordController } from "./dist/crosswords.js";

    const status = document.getElementById("status");
    const started = Date.now();
    let revealed = 0;

    const controller = newCrosswordController(window.SP_PUZZLE,
      document.getElementById("crossword-grid-placeholder"),
      document.getElementById("crossword-clues-placeholder"));

    if (!controller?.isValid) {
      status.textContent = "Şəbəkə yüklənmədi — puzzle.js faylını yoxlayın.";
      throw new Error("crosswords-js: yararsız tərif");
    }

    controller.bindUserEventHandlersToIds();

    controller.addEventsListener(["cellRevealed", "clueRevealed", "crosswordRevealed"], () => revealed++);

    controller.addEventsListener(["clueSelected"], (clue) => {
      status.textContent = `${clue.isAcross ? "Üfüqi" : "Şaquli"} ${clue.headNumber} · ${clue.lengthText}`;
    });

    controller.addEventsListener(["crosswordSolved"], () => {
      const minutes = Math.round((Date.now() - started) / 60000);
      const points = Math.max(40, 100 - revealed * 10 - Math.min(30, minutes));
      status.textContent = `Şəbəkə tamamlandı · ${minutes} dəqiqə · +${points} xal`;
      window.parent.postMessage({ type: "spartans:result", game: "crossword", won: true, points, minutes, revealed }, "*");
    });

    status.textContent = `${window.SP_PUZZLE.acrossClues.length + window.SP_PUZZLE.downClues.length} sual · ${window.SP_PUZZLE.width}×${window.SP_PUZZLE.height} şəbəkə · hücrəyə klikləyib hərf yazın`;
  </script>
</body>
</html>
